<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NOVA SYSTEMS - DRE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#050505;color:white;overflow-x:hidden;cursor:crosshair;}

/* ===== CINEMATIC LOADING SCREEN (NEW) ===== */
#intro{
position:fixed;
inset:0;
z-index:99999;
background:radial-gradient(circle at center,#120000,#000);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
animation:fadeOut 1s ease 5s forwards;
}

.loaderRing{
width:90px;
height:90px;
border-radius:50%;
border:2px solid rgba(255,0,0,0.2);
border-top:2px solid red;
animation:spin 1s linear infinite;
margin-bottom:20px;
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

.loadingText{
color:#ff2b2b;
font-size:16px;
letter-spacing:2px;
text-align:center;
animation:glow 1.5s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 5px red;}
to{text-shadow:0 0 20px red;}
}

.subText{
margin-top:10px;
color:#aaa;
font-size:12px;
opacity:0.8;
}

/* VIDEO BG */
.video-bg{position:fixed;inset:0;z-index:-3;transform:scale(1.1);animation:zoom 8s ease forwards;}
.video-bg video{width:100%;height:100%;object-fit:cover;filter:brightness(0.35);}
@keyframes zoom{from{transform:scale(1.3)}to{transform:scale(1)}}

.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:15px;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);border-bottom:1px solid red;}
.logo{color:red;font-weight:bold;}
.menu{display:flex;gap:10px;}
.menu button{padding:8px 12px;border:none;border-radius:8px;background:rgba(255,0,0,0.2);color:white;cursor:pointer;}
.menu button:hover{background:red;}
.discord{background:#5865F2 !important;}

.creator{margin:25px auto;width:90%;max-width:600px;background:rgba(255,255,255,0.05);border:1px solid red;padding:20px;border-radius:20px;backdrop-filter:blur(20px);cursor:pointer;}
.creator-info{display:flex;gap:15px;align-items:center;margin-top:10px;}
.creator img{width:90px;height:90px;border-radius:50%;border:2px solid red;}

.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px;}
.card{background:rgba(255,255,255,0.05);border:1px solid red;border-radius:15px;padding:15px;}
.card img{width:100%;border-radius:10px;}
.card h3{color:red;}
.tag{padding:5px 10px;background:rgba(255,0,0,0.2);border-radius:20px;font-size:12px;}
button.watch{margin-top:10px;padding:8px 12px;background:red;border:none;color:white;border-radius:8px;cursor:pointer;}
.bottom{position:fixed;bottom:10px;right:15px;color:#777;font-size:12px;}

#discordModal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;justify-content:center;align-items:center;z-index:99999;}
.modalBox{background:#111;padding:20px;border:1px solid red;border-radius:15px;text-align:center;width:300px;}
.modalBox button{padding:10px 15px;margin:10px;border:none;border-radius:8px;cursor:pointer;}
.join{background:#5865F2;color:white;}
.cancel{background:#333;color:white;}
</style>
</head>
<body>

<!-- NEW LOADING SCREEN -->
<div id="intro">
<div class="loaderRing"></div>
<div class="loadingText">NOVA SYSTEMS STARTING</div>
<div class="subText">Initializing developer environment...</div>
</div>

<div class="video-bg">
<video autoplay muted loop>
<source src="https://cdn.coverr.co/videos/coverr-red-neon-light-8572/1080p.mp4">
</video>
</div>

<div class="topbar">
<div class="logo">NOVA SYSTEMS</div>
<div class="menu">
<button onclick="setFilter('ALL')">ALL</button>
<button onclick="setFilter('ROBLOX SYSTEM')">SYSTEM</button>
<button onclick="setFilter('ANTI CHEAT')">ANTI CHEAT</button>
<button class="discord" onclick="openDiscord()">DISCORD</button>
</div>
</div>

<div class="creator" onclick="openAbout()">
<div class="creator-info">
<img src="https://www.roblox.com/headshot-thumbnail/image?userId=890941690&width=420&height=420&format=png"/>
<div>
<h2>Drev</h2>
<p>@carlgoodguy2663</p>
<p>3 Years Roblox Developer</p>
</div>
</div>
</div>

<div class="container" id="grid"></div>
<div class="bottom">MADE BY DRE</div>

<div id="discordModal">
<div class="modalBox">
<h2 style="color:red">NOVA INNOVATION</h2>
<p>Join Discord Server?</p>
<button class="join" onclick="window.open('https://discord.gg/9qMJArygZn','_blank')">JOIN</button>
<button class="cancel" onclick="closeDiscord()">CANCEL</button>
</div>
</div>

<script>

// remove loader
setTimeout(()=>{
document.getElementById('intro').style.display='none';
},5000);

function pop(){let c=new (window.AudioContext||window.webkitAudioContext)();let o=c.createOscillator();let g=c.createGain();o.type='sine';o.frequency.value=520;g.gain.value=0.05;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.15);setTimeout(()=>o.stop(),150);}

function openDiscord(){pop();document.getElementById('discordModal').style.display='flex';}
function closeDiscord(){pop();document.getElementById('discordModal').style.display='none';}
function openAbout(){pop();alert('Drev - Roblox Developer\nLuaU Systems | Anti Cheat | RP Systems');}

const CHANNEL_ID="UC4EyQDoAywwm5iFAlyviMiQ";
const RSS=`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;

let all=[],current="ALL";
function setFilter(f){current=f;render();pop();}
function typeCat(t){return t.toLowerCase().includes('anti cheat')?'ANTI CHEAT':'ROBLOX SYSTEM';}
function render(){let g=document.getElementById('grid');g.innerHTML='';all.forEach(v=>{let c=typeCat(v.title);if(current!='ALL'&&c!=current)return;g.innerHTML+=`<div class='card'><img src='${v.thumb}'><h3>${v.title}</h3><span class='tag'>${c}</span><button class='watch' onclick="pop();window.open('${v.link}','_blank')">WATCH</button></div>`;});}
async function load(){let r=await fetch(RSS);let d=await r.json();all=(d.items||[]).map(x=>({title:x.title,thumb:x.thumbnail,link:x.link}));render();}
load();

</script>
</body>
</html>
